{% extends "base.html" %}

{% block title %}{{ error_code }} - 进销存管理系统{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="display-1 text-muted">{{ error_code }}</h1>
            <h3 class="mb-3">{{ error_message }}</h3>
            <p class="text-muted mb-4">{{ error_detail }}</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                <i class="bi bi-house"></i> 返回首页
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-arrow-left"></i> 返回上一页
            </button>
        </div>
    </div>
</div>
{% endblock %}
