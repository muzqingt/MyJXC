{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">导入结果</h6>
                </div>
                <div class="card-body">
                    <div class="row text-center mb-4">
                        <div class="col-md-4">
                            <div class="h3 mb-0 text-success">{{ success_count }}</div>
                            <div class="text-muted">成功</div>
                        </div>
                        <div class="col-md-4">
                            <div class="h3 mb-0 text-danger">{{ fail_count }}</div>
                            <div class="text-muted">失败</div>
                        </div>
                        <div class="col-md-4">
                            <div class="h3 mb-0 text-warning">{{ skip_count }}</div>
                            <div class="text-muted">跳过</div>
                        </div>
                    </div>

                    {% if errors %}
                    <div class="alert alert-warning">
                        <h6>错误详情：</h6>
                        <ul class="mb-0">
                            {% for error in errors %}
                            <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}

                    <div class="mt-3">
                        <a href="{{ url_for('product.import_page') }}" class="btn btn-primary">
                            <i class="bi bi-arrow-left"></i> 继续导入
                        </a>
                        <a href="{{ url_for('product.index') }}" class="btn btn-secondary">
                            <i class="bi bi-list"></i> 查看商品列表
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
